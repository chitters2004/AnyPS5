name: Fork warm

on:
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Warm even when this head of upstream main was warmed before
        required: false
        default: false
        type: boolean

concurrency:
  group: fork-warm
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/boykopovar/AnyPS5.git
  UPSTREAM_SLUG: boykopovar/AnyPS5

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      stale: ${{ steps.verdict.outputs.stale }}
    steps:
      - id: head
        run: echo "sha=$(git ls-remote "$UPSTREAM" refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: marker
        uses: actions/cache/restore@v6
        with:
          path: marker
          key: warm-done-${{ steps.head.outputs.sha }}
          lookup-only: true
      - id: verdict
        env:
          HIT: ${{ steps.marker.outputs.cache-hit }}
          FORCE: ${{ inputs.force }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          if [ "$HIT" = true ] && [ "$FORCE" != true ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "upstream main $SHA was warmed before; nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "warming upstream main $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  warm:
    needs: check
    if: ${{ needs.check.outputs.stale == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/fork-ci.yml
    with:
      repository: boykopovar/AnyPS5
      ref: ${{ needs.check.outputs.sha }}
      base: ${{ needs.check.outputs.sha }}
      tests: none
      jobs: warm

  check-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      stale: ${{ steps.verdict.outputs.stale }}
    steps:
      - id: head
        run: echo "sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/draft/cloud/integration/stack | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: marker
        if: ${{ steps.head.outputs.sha != '' }}
        uses: actions/cache/restore@v6
        with:
          path: marker
          key: warm-stack-done-${{ steps.head.outputs.sha }}
          lookup-only: true
      - id: verdict
        env:
          HIT: ${{ steps.marker.outputs.cache-hit }}
          FORCE: ${{ inputs.force }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          if [ -z "$SHA" ] || { [ "$HIT" = true ] && [ "$FORCE" != true ]; }; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "stack head ${SHA:-none} was warmed before (or the branch is missing); nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "warming the stack head $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  warm-stack:
    needs: check-stack
    if: ${{ needs.check-stack.outputs.stale == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/fork-ci.yml
    with:
      ref: ${{ needs.check-stack.outputs.sha }}
      base: ${{ needs.check-stack.outputs.sha }}
      tests: none
      jobs: warm-stack

  mark-stack:
    needs: [check-stack, warm-stack]
    if: ${{ needs.warm-stack.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir marker
          echo "${{ needs.check-stack.outputs.sha }}" > marker/head
      - uses: actions/cache/save@v6
        with:
          path: marker
          key: warm-stack-done-${{ needs.check-stack.outputs.sha }}

  mark:
    needs: [check, warm]
    if: ${{ needs.warm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir marker
          echo "${{ needs.check.outputs.sha }}" > marker/head
      - uses: actions/cache/save@v6
        with:
          path: marker
          key: warm-done-${{ needs.check.outputs.sha }}

  prune:
    needs: [check, warm, mark, check-stack, warm-stack, mark-stack]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep the newest compiler cache of each key and delete the rest
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" -q '.actions_caches[] | [.id, .key, .created_at, .size_in_bytes, .ref] | @tsv' > caches.tsv
          python3 - <<'PY' > delete.txt
          import re
          rows = [line.split() for line in open("caches.tsv")]
          groups = {}
          for cid, key, created, size, ref in rows:
              m = re.match(r"(ccache-[a-z]+(?:-[a-z]+)*)-\d{4}-", key)
              if m:
                  groups.setdefault((ref, m[1]), []).append((created, cid))
          for name, items in groups.items():
              for created, cid in sorted(items, reverse=True)[1:]:
                  print(cid)
          PY
          echo "deleting $(wc -l < delete.txt) old compiler caches"
          while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent || true; done < delete.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" -q '"cache usage now \(.active_caches_size_in_bytes / 1048576 | floor) MB"'
